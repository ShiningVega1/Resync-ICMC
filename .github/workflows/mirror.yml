name: Capture ICMC public website
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mirror.py
      - .github/workflows/mirror.yml
permissions:
  contents: write
concurrency:
  group: icmc-public-mirror
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Capture public pages and assets
        run: python scripts/mirror.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-diagnostics
          path: |
            mirror.log
            mirror-report.json
      - name: Commit captured site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs index.html mirror-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture ICMC public pages and assets for redesign'
            git push
          fi
