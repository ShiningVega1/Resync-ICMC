name: Capture ICMC public website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: icmc-public-mirror
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Capture public pages and assets
        run: python scripts/mirror.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-diagnostics
          path: |
            mirror.log
            mirror-report.json
      - name: Upload captured snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: captured-site
          path: |
            docs
            index.html
            mirror-report.json
