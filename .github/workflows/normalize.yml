name: Normalize mirror filenames
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/normalize.py
      - name: Upload normalized output
        uses: actions/upload-artifact@v4
        with:
          name: normalized-site
          path: |
            docs
            filename-fixes.json
